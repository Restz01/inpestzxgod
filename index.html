<!-- Background video: put your own bg.mp4 (and optionally bg.webm) next to this file.

<video id="bgv" muted loop playsinline preload="auto" aria-hidden="true">
  <source src="bg.webm" type="video/webm">
  <source src="bg.mp4" type="video/mp4">
</video>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="shoot" id="shoot" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

    <button type="button" data-lang="en">EN</button>

</div>

      <a class="btn glass donate" data-name="Donate" data-meteor href="https://ezdn.app/inpestz" target="_blank" rel="noopener noreferrer">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 2.7 5 6.1 5c2 0 3.2 1.1 3.9 2.2C10.7 6.1 11.9 5 13.9 5c3.4 0 5.2 3.5 3.7 6.8C15.5 16.4 12 21 12 21z" transform="translate(1 0) scale(.95)"/></svg>
